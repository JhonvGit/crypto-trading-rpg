<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💼 Trading Office — Escritório de Investimentos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a1a;
  font-family: 'Segoe UI', system-ui, monospace;
  color: #e0e0ff;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ── */
#topbar {
  background: linear-gradient(90deg, #0a0a20, #1a1a35, #0a0a20);
  border-bottom: 2px solid #ffd700;
  padding: 0 1.5rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
  box-shadow: 0 2px 20px rgba(255,215,0,0.15);
}
#topbar h1 {
  font-size: 1.3rem;
  color: #ffd700;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 900;
}
.topbar-center {
  display: flex;
  gap: 2rem;
  align-items: center;
}
.stat-pill {
  background: rgba(255,255,255,0.05);
  border: 1px solid #252545;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  color: #aaa;
}
.stat-pill strong { color: #ffd700; }
#status {
  font-size: 0.78rem;
  color: #00ff88;
  font-weight: bold;
}
#clock {
  font-family: 'Courier New', monospace;
  font-size: 1.1rem;
  color: #00ff88;
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.3);
  border-radius: 6px;
  padding: 2px 10px;
}

/* ── MAIN LAYOUT ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── OFFICE CANVAS (center) ── */
#office-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, #1a1a33 0%, #080818 100%);
}

#office-canvas {
  position: absolute;
  top: 0; left: 0;
  cursor: grab;
  image-rendering: pixelated;
}
#office-canvas:active { cursor: grabbing; }

/* Tooltip */
#tooltip {
  position: absolute;
  background: rgba(10,10,30,0.96);
  border: 2px solid #ffd700;
  border-radius: 10px;
  padding: 10px 14px;
  min-width: 210px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 100;
  box-shadow: 0 4px 24px rgba(0,0,0,0.8);
}
#tooltip.show { opacity: 1; }
.tt-name { font-weight: bold; font-size: 1rem; color: #ffd700; margin-bottom: 6px; }
.tt-row { font-size: 0.82rem; color: #ccc; margin: 3px 0; }
.tt-pnl { font-size: 1.1rem; font-weight: bold; margin-top: 6px; }
.tt-pnl.up { color: #00ff88; }
.tt-pnl.dn { color: #ff4466; }

/* Camera controls */
#cam-controls {
  position: absolute;
  right: 14px;
  top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 50;
}
.cam-btn {
  width: 36px; height: 36px;
  background: rgba(20,20,43,0.9);
  border: 1px solid #333;
  border-radius: 7px;
  color: #ffd700;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.cam-btn:hover { background: #ffd700; color: #000; box-shadow: 0 0 12px rgba(255,215,0,0.5); }

/* ── RIGHT PANEL ── */
#right-panel {
  width: 330px;
  flex-shrink: 0;
  background: #0d0d1e;
  border-left: 2px solid #1a1a33;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-block {
  padding: 0.9rem 1rem;
  border-bottom: 1px solid #1a1a30;
}
.panel-block h3 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #ffd700;
  margin-bottom: 0.7rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #252545;
}

/* Ranking */
#ranking-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 280px;
  overflow-y: auto;
}
.rank-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 7px;
  background: rgba(255,255,255,0.025);
  border: 1px solid #1e1e35;
  cursor: pointer;
  transition: all 0.15s;
}
.rank-row:hover { background: rgba(255,255,255,0.07); border-color: #ffd700; }
.rank-row.leader { background: rgba(255,215,0,0.08); border-color: rgba(255,215,0,0.4); }
.rr-pos { font-size: 0.85rem; font-weight: bold; color: #666; min-width: 20px; }
.rr-emoji { font-size: 1.5rem; line-height: 1; }
.rr-info { flex: 1; min-width: 0; }
.rr-name { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-gen { font-size: 0.68rem; color: #888; }
.rr-val { font-size: 0.82rem; color: #ccc; }
.rr-pnl { font-size: 0.82rem; font-weight: bold; }
.rr-pnl.up { color: #00ff88; }
.rr-pnl.dn { color: #ff4466; }
.rr-pnl.nt { color: #666; }

/* Activity feed */
#activity-wrap {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#activity-feed {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 0.9rem 1rem;
}
#activity-feed::-webkit-scrollbar { width: 4px; }
#activity-feed::-webkit-scrollbar-track { background: transparent; }
#activity-feed::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

.act-item {
  font-size: 0.78rem;
  padding: 6px 8px;
  border-radius: 6px;
  border-left: 3px solid #444;
  background: rgba(255,255,255,0.02);
  line-height: 1.4;
  animation: fadeSlide 0.3s ease;
}
.act-item.buy  { border-left-color: #00ff88; }
.act-item.sell { border-left-color: #ff4466; }
.act-item.ev   { border-left-color: #e056fd; background: rgba(224,86,253,0.06); }
.act-agent  { font-weight: bold; color: #ffd700; }
.act-buy    { color: #00ff88; font-weight: bold; }
.act-sell   { color: #ff4466; font-weight: bold; }
.act-evo    { color: #e056fd; font-weight: bold; }
.act-time   { color: #555; font-size: 0.68rem; display: block; margin-top: 2px; }

/* Mini chart */
#mini-chart {
  width: 100%;
  height: 120px;
  display: block;
  border-radius: 6px;
  background: rgba(0,0,0,0.3);
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: none; }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <h1>💼 Trading Office</h1>
  <div class="topbar-center">
    <div class="stat-pill">Agentes ativos: <strong id="count-active">—</strong></div>
    <div class="stat-pill">Gerações: <strong id="count-gen">—</strong></div>
    <div class="stat-pill">Eliminados: <strong id="count-elim">0</strong></div>
    <div id="status">🔄 Conectando...</div>
  </div>
  <div id="clock">00:00:00</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- OFFICE CANVAS -->
  <div id="office-wrap">
    <canvas id="office-canvas"></canvas>

    <div id="tooltip">
      <div class="tt-name" id="tt-name"></div>
      <div class="tt-row" id="tt-class"></div>
      <div class="tt-row" id="tt-gen"></div>
      <div class="tt-row" id="tt-sym"></div>
      <div class="tt-row" id="tt-bal"></div>
      <div class="tt-pnl" id="tt-pnl"></div>
    </div>

    <div id="cam-controls">
      <button class="cam-btn" id="btn-zi">+</button>
      <button class="cam-btn" id="btn-zo">−</button>
      <button class="cam-btn" id="btn-zr">↺</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="panel-block">
      <h3>🏆 Ranking</h3>
      <div id="ranking-list"></div>
    </div>

    <div class="panel-block" style="padding-bottom:0.6rem">
      <h3>📈 Performance</h3>
      <canvas id="mini-chart"></canvas>
    </div>

    <div class="panel-block" id="activity-header">
      <h3>📡 Atividade ao Vivo</h3>
    </div>
    <div id="activity-wrap">
      <div id="activity-feed"></div>
    </div>
  </div>

</div>

<script src="/static/office.js"></script>
</body>
</html>
